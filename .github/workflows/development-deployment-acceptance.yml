name: Development Deployment Acceptance

on:
  push:
    branches:
      - 'ci/dev-deployment-acceptance'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-docker-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create disposable development remote and server checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/sawiyaa-acceptance.git
          git clone --bare "$GITHUB_WORKSPACE" /tmp/sawiyaa-acceptance.git
          git --git-dir=/tmp/sawiyaa-acceptance.git update-ref refs/heads/development "$GITHUB_SHA"
          sudo rm -rf /opt/sawiyaa-dev
          sudo git clone --branch development "file:///tmp/sawiyaa-acceptance.git" /opt/sawiyaa-dev
          sudo git -C /opt/sawiyaa-dev config user.email acceptance@sawiyaa.test
          sudo git -C /opt/sawiyaa-dev config user.name acceptance
          sudo git -C /opt/sawiyaa-dev rev-parse HEAD | sudo tee /tmp/exact-deployment-sha.txt

      - name: Generate redacted development environment
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo cp deploy/env/development.backend.example /opt/sawiyaa-dev/sawiyaa-backend-v1/.env.development
          sudo cp deploy/env/development.frontend.example /opt/sawiyaa-dev/sawiyaa-frontend-v1/.env.development
          sudo python3 - <<'PY'
          from pathlib import Path
          root = Path('/opt/sawiyaa-dev')
          backend = root / 'sawiyaa-backend-v1/.env.development'
          frontend = root / 'sawiyaa-frontend-v1/.env.development'
          replacements = {
              'APP_URL': 'http://acceptance.sawiyaa.test:8080',
              'WEB_APP_URL': 'http://acceptance.sawiyaa.test:8080',
              'APP_BASE_URL': 'http://acceptance.sawiyaa.test:8080',
              'CORS_ORIGINS': 'http://acceptance.sawiyaa.test:8080',
              'DATABASE_URL': 'postgresql://sawiyaa_dev:accept-password@postgres:5432/sawiyaa_dev',
              'POSTGRES_PASSWORD': 'accept-password',
              'JWT_ACCESS_SECRET': 'accept-access-secret-for-ci-only',
              'JWT_REFRESH_SECRET': 'accept-refresh-secret-for-ci-only',
              'DAILY_API_KEY': 'accept-daily-key',
              'DAILY_WEBHOOK_SECRET': 'accept-daily-webhook-secret',
              'CORPORATE_CODE_PEPPER': 'accept-corporate-pepper-012345678901234567890',
              'MAIL_HOST': 'mailpit', 'MAIL_PORT': '1025', 'MAIL_USER': 'accept-user',
              'MAIL_PASS': 'accept-password', 'GEOIP_ENABLED': 'false',
              'GEOIP_DATABASE_PATH': '', 'SAWIYAA_DEV_COUNTRY_CODE': 'EG',
              'NOTIFICATION_QUEUE_ENABLED': 'false', 'DAILY_ATTENDANCE_QUEUE_ENABLED': 'false',
          }
          def rewrite(path, values):
              lines = []
              seen = set()
              for line in path.read_text().splitlines():
                  if '=' in line and not line.lstrip().startswith('#'):
                      name = line.split('=', 1)[0].strip()
                      if name in values:
                          line = f'{name}={values[name]}'
                          seen.add(name)
                      elif line.split('=', 1)[1].strip().startswith('<'):
                          line = f'{name}=accept-{name.lower()}'
                  lines.append(line)
              path.write_text('\n'.join(lines) + '\n')
          rewrite(backend, replacements)
          rewrite(frontend, {
              'NEXT_PUBLIC_APP_URL': 'http://acceptance.sawiyaa.test:8080',
              'NEXT_PUBLIC_SITE_URL': 'http://acceptance.sawiyaa.test:8080',
              'NEXT_PUBLIC_CHAT_SOCKET_URL': 'http://acceptance.sawiyaa.test:8080',
              'NEXT_PUBLIC_API_URL': '/api/v1', 'API_PROXY_TARGET': 'http://backend:7000',
          })
          backend.chmod(0o600); frontend.chmod(0o600)
          PY

      - name: Execute actual development update workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          set +e
          sudo env \
            SAWIYAA_FORCE_DOCKER_VALIDATOR=true \
            SAWIYAA_DEV_HTTP_PORT=8080 \
            bash /opt/sawiyaa-dev/deploy/server/update-dev.sh 2>&1 |
            sed -E 's/(password|secret|token|api[_-]?key|authorization|database[_-]?url)[^[:space:],;]*/[REDACTED]/Ig' |
            tee /tmp/dev-acceptance.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Publish redacted acceptance failure summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo '## Development acceptance diagnostic summary'
            if [ -s /tmp/dev-acceptance.log ]; then
              echo '```text'
              sed -E 's/(password|secret|token|api[_-]?key|authorization|database[_-]?url)[^[:space:],;]*/[REDACTED]/Ig' /tmp/dev-acceptance.log |
                grep -Ei 'error|exception|failed|unknown argument|invalid|prisma|seed|exit code' |
                tail -n 120 || true
              echo '```'
            else
              echo 'No development acceptance log was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/dev-acceptance.log ]; then
            root_error="$(sed -E 's/(password|secret|token|api[_-]?key|authorization|database[_-]?url)[^[:space:],;]*/[REDACTED]/Ig' /tmp/dev-acceptance.log | grep -Ei 'Seed failed|PrismaClient|Unknown argument|Error:|Failure|failed|FATAL|not found' | grep -Evi 'PRESENT|OPTIONAL|REQUIRED|npm warn|deprecated|next.config|invalid' | tail -n 1 || true)"
            if [ -n "$root_error" ]; then
              root_error="${root_error:0:500}"
              echo "::error title=Development acceptance first error::$root_error"
            fi
          fi

      - name: Verify application usability and runtime contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          verify_log=/tmp/development-verify.log
          : > "$verify_log"
          trap 'rc=$?; { echo "## Application verification diagnostics"; echo "```text"; cat "$verify_log"; echo "```"; } >> "$GITHUB_STEP_SUMMARY"; exit "$rc"' EXIT
          record() { echo "$*" | tee -a "$verify_log"; }
          check_http() {
            local name="$1" url="$2" status
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url" || true)"
            record "$name: HTTP $status ($url)"
            case "$status" in
              2*|3*) ;;
              *) echo "::error title=HTTP acceptance check failed::$name returned HTTP $status ($url)"; return 1 ;;
            esac
          }
          check_http frontend 'http://127.0.0.1:8080/ar/signin/patient'
          check_http backend-health 'http://127.0.0.1:8080/api/v1/health'
          check_http public-help 'http://127.0.0.1:8080/api/v1/public/help'
          record 'frontend-internal: starting'
          sudo docker compose --env-file /opt/sawiyaa-dev/sawiyaa-backend-v1/.env.development --env-file /opt/sawiyaa-dev/sawiyaa-frontend-v1/.env.development -p sawiyaa-dev -f /opt/sawiyaa-dev/docker-compose.dev.yml exec -T frontend node -e "fetch('http://127.0.0.1:3000/ar/signin/patient').then((r) => { console.log('frontend-internal: HTTP ' + r.status); process.exit(r.ok ? 0 : 1); }).catch((error) => { console.error(error.message); process.exit(1); })" || { echo "::error title=Application verification failed::frontend-internal check failed"; exit 1; }
          record 'mailpit-dns: starting'
          sudo docker compose --env-file /opt/sawiyaa-dev/sawiyaa-backend-v1/.env.development --env-file /opt/sawiyaa-dev/sawiyaa-frontend-v1/.env.development -p sawiyaa-dev -f /opt/sawiyaa-dev/docker-compose.dev.yml exec -T backend node -e "require('node:dns').promises.lookup('mailpit').then(() => { console.log('mailpit-dns: resolved'); process.exit(0); }).catch((error) => { console.error(error.message); process.exit(1); })" || { echo "::error title=Application verification failed::mailpit-dns check failed"; exit 1; }
          record 'mailpit-smtp: starting'
          sudo docker compose --env-file /opt/sawiyaa-dev/sawiyaa-backend-v1/.env.development --env-file /opt/sawiyaa-dev/sawiyaa-frontend-v1/.env.development -p sawiyaa-dev -f /opt/sawiyaa-dev/docker-compose.dev.yml exec -T backend node -e "const net = require('node:net'); const socket = net.connect(1025, 'mailpit'); socket.once('connect', () => { console.log('mailpit-smtp: connected'); socket.destroy(); process.exit(0); }); socket.once('error', (error) => { console.error(error.message); process.exit(1); });" || { echo "::error title=Application verification failed::mailpit-smtp TCP check failed"; exit 1; }
          record 'backend-log-write: starting'
          sudo docker compose --env-file /opt/sawiyaa-dev/sawiyaa-backend-v1/.env.development --env-file /opt/sawiyaa-dev/sawiyaa-frontend-v1/.env.development -p sawiyaa-dev -f /opt/sawiyaa-dev/docker-compose.dev.yml exec -T backend sh -c 'touch /app/logs/acceptance-write && rm /app/logs/acceptance-write' || { echo "::error title=Application verification failed::backend-log-write check failed"; exit 1; }
          backend_owner="$(stat -c '%u:%g' /opt/sawiyaa-dev/logs/backend)"
          record "backend-log-owner: $backend_owner"
          test "$backend_owner" = '10001:10001' || { echo "::error title=Application verification failed::backend-log-owner expected 10001:10001, got $backend_owner"; exit 1; }
          status="$(curl --http1.1 --silent --output /dev/null --write-out '%{http_code}' -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Key: SGVsbG9BY2NlcHRhbmNl' 'http://127.0.0.1:8080/socket.io/?EIO=4&transport=websocket')"
          record "websocket: HTTP $status"
          case "$status" in 101|200|400) ;; *) echo "::error title=Application verification failed::websocket returned HTTP $status" >&2; exit 1;; esac

      - name: Repeat actual development update workflow
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          set +e
          sudo env \
            SAWIYAA_FORCE_DOCKER_VALIDATOR=true \
            SAWIYAA_DEV_HTTP_PORT=8080 \
            bash /opt/sawiyaa-dev/deploy/server/update-dev.sh 2>&1 |
            sed -E 's/(password|secret|token|api[_-]?key|authorization|database[_-]?url)[^[:space:],;]*/[REDACTED]/Ig' |
            tee -a /tmp/dev-acceptance.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Verify frontend build-time values and resource isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          config=/tmp/sawiyaa-compose-config.json
          sudo docker compose --env-file /opt/sawiyaa-dev/sawiyaa-backend-v1/.env.development --env-file /opt/sawiyaa-dev/sawiyaa-frontend-v1/.env.development -p sawiyaa-dev -f /opt/sawiyaa-dev/docker-compose.dev.yml config --format json > "$config"
          node - "$config" <<'NODE'
          const fs = require('node:fs');
          const services = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).services;
          const args = services.frontend.build.args;
          for (const name of ['NEXT_PUBLIC_APP_URL', 'NEXT_PUBLIC_SITE_URL', 'NEXT_PUBLIC_CHAT_SOCKET_URL']) {
            if (!args[name] || /localhost|127\.0\.0\.1/i.test(args[name])) throw new Error(`invalid frontend build arg: ${name}`);
          }
          if (Object.keys(services).some((name) => !['nginx','backend','frontend','postgres','mailpit','worker','backend_volume_init'].includes(name))) throw new Error('unexpected service');
          if ((services.postgres.ports || []).length || (services.backend.ports || []).length || (services.frontend.ports || []).length || (services.mailpit.ports || []).length) throw new Error('non-nginx public port binding');
          if ((services.nginx.ports || []).length !== 1) throw new Error('nginx ingress binding missing');
          NODE
          ! sudo docker ps --format '{{.Names}}' | grep -E 'sawiyaa($|-prod)' || true

      - name: Failure diagnostics (redacted service output only)
        if: failure()
        shell: bash
        run: |
          set +e
          diag_dir="$RUNNER_TEMP/development-deployment-acceptance-logs"
          mkdir -p "$diag_dir"
          redact() { sed -E 's/(password|secret|token|api[_-]?key|authorization|database[_-]?url)[^[:space:],;]*/[REDACTED]/Ig'; }
          compose=(sudo docker compose --env-file /opt/sawiyaa-dev/sawiyaa-backend-v1/.env.development --env-file /opt/sawiyaa-dev/sawiyaa-frontend-v1/.env.development -p sawiyaa-dev -f /opt/sawiyaa-dev/docker-compose.dev.yml)
          "${compose[@]}" ps 2>&1 | redact > "$diag_dir/compose-ps.txt"
          for service in postgres backend frontend nginx; do
            "${compose[@]}" logs --tail=200 "$service" 2>&1 | redact > "$diag_dir/$service.log"
          done
          sudo docker ps -a 2>&1 | redact > "$diag_dir/docker-ps.txt"
          sudo docker volume ls 2>&1 | redact > "$diag_dir/docker-volume-ls.txt"
          sudo docker network ls 2>&1 | redact > "$diag_dir/docker-network-ls.txt"

      - name: Annotate frontend container failure
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          frontend_log="$RUNNER_TEMP/development-deployment-acceptance-logs/frontend.log"
          if [ -s "$frontend_log" ]; then
            frontend_error="$(sed -E 's/(password|secret|token|api[_-]?key|authorization|database[_-]?url)[^[:space:],;]*/[REDACTED]/Ig' "$frontend_log" | grep -Ei 'error|exception|failed|fatal|unhealthy|cannot|unable|not found' | grep -Evi 'npm warn|deprecated|next.config' | tail -n 1 || true)"
            if [ -n "$frontend_error" ]; then
              frontend_error="${frontend_error:0:500}"
              echo "::error title=Frontend container diagnostic::$frontend_error"
            fi
          fi

      - name: Prepare development acceptance diagnostic bundle
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          diag_dir="$RUNNER_TEMP/development-deployment-acceptance-logs"
          mkdir -p "$diag_dir"
          if [ -f /tmp/dev-acceptance.log ]; then cp /tmp/dev-acceptance.log "$diag_dir/dev-acceptance.log"; else : > "$diag_dir/dev-acceptance.log"; fi
          if [ -f /tmp/exact-deployment-sha.txt ]; then cp /tmp/exact-deployment-sha.txt "$diag_dir/exact-deployment-sha.txt"; else : > "$diag_dir/exact-deployment-sha.txt"; fi
          {
            echo '## Exact deployment SHA'
            echo '```text'
            cat "$diag_dir/exact-deployment-sha.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for file in compose-ps.txt postgres.log backend.log frontend.log nginx.log docker-ps.txt; do
            [ -f "$diag_dir/$file" ] || : > "$diag_dir/$file"
          done

      - name: Upload development acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-deployment-acceptance-logs
          path: ${{ runner.temp }}/development-deployment-acceptance-logs/
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup acceptance resources
        if: always()
        shell: bash
        run: |
          set +e
          sudo docker compose --env-file /opt/sawiyaa-dev/sawiyaa-backend-v1/.env.development --env-file /opt/sawiyaa-dev/sawiyaa-frontend-v1/.env.development -p sawiyaa-dev -f /opt/sawiyaa-dev/docker-compose.dev.yml down --remove-orphans
          sudo rm -rf /opt/sawiyaa-dev /tmp/sawiyaa-acceptance.git

  production-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Run production regression from candidate worktree
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test deploy/server/deployment-hardening.test.js
          cp deploy/env/production.backend.example sawiyaa-backend-v1/.env.production
          cp deploy/env/production.frontend.example sawiyaa-frontend-v1/.env.production
          printf '%s\n' 'POSTGRES_DB=sawiyaa' 'POSTGRES_USER=sawiyaa' 'POSTGRES_PASSWORD=regression-password' 'PGDATA=/var/lib/postgresql/data/pgdata' > .env.production.db
          docker compose --env-file .env.production.db --env-file sawiyaa-frontend-v1/.env.production -f docker-compose.prod.yml config --quiet
