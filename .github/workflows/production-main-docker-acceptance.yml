name: Production Main Docker Acceptance

on:
  push:
    branches:
      - ci/production-main-docker-acceptance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-linux-docker-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_SHA: 6eb31f781909b3e3eded42aaf17c6163ea7a093d
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize exact production source and safe env fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error title=production source materialization failure::$BASH_COMMAND exit=$rc"; exit "$rc"' ERR
          rm -rf /tmp/sawiyaa-source
          git clone --branch "$GITHUB_REF_NAME" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" /tmp/sawiyaa-source
          git -C /tmp/sawiyaa-source fetch --no-tags origin "$TARGET_SHA"
          git -C /tmp/sawiyaa-source checkout --detach "$GITHUB_SHA"
          git -C /tmp/sawiyaa-source checkout -B main "$GITHUB_SHA"
          sudo rm -rf /opt/sawiyaa /opt/sawiyaa-backups
          sudo cp -a /tmp/sawiyaa-source /opt/sawiyaa
          sudo git -C /opt/sawiyaa status --porcelain
          test "$(sudo git -C /opt/sawiyaa rev-parse HEAD)" = "$GITHUB_SHA"
          sudo git -C /opt/sawiyaa merge-base --is-ancestor "$TARGET_SHA" HEAD
          sudo mkdir -p /opt/sawiyaa-backups /opt/sawiyaa/logs/backend /opt/sawiyaa/geoip /opt/sawiyaa/deploy/certs/live/sawiyaa.com
          sudo cp /opt/sawiyaa/deploy/env/production.backend.example /opt/sawiyaa/sawiyaa-backend-v1/.env.production
          sudo cp /opt/sawiyaa/deploy/env/production.frontend.example /opt/sawiyaa/sawiyaa-frontend-v1/.env.production
          sudo python3 - <<'PY'
          from pathlib import Path
          root = Path('/opt/sawiyaa')
          backend = root / 'sawiyaa-backend-v1/.env.production'
          frontend = root / 'sawiyaa-frontend-v1/.env.production'
          replacements = {
              'DATABASE_URL': 'postgresql://sawiyaa:accept-password@postgres:5432/sawiyaa',
              'POSTGRES_PASSWORD': 'accept-password',
              'JWT_ACCESS_SECRET': 'accept-production-access-secret-012345678901234567890',
              'JWT_REFRESH_SECRET': 'accept-production-refresh-secret-012345678901234567890',
              'DAILY_API_KEY': 'accept-daily-api-key',
              'DAILY_WEBHOOK_SECRET': 'accept-daily-webhook-secret',
              'PAYMOB_EGP_CARD_INTEGRATION_ID': 'accept-paymob-egp-card',
              'CORPORATE_CODE_PEPPER': 'accept-corporate-pepper-012345678901234567890',
              'MAIL_FROM': 'accept@sawiyaa.test', 'MAIL_HOST': '127.0.0.1',
              'MAIL_PORT': '1025', 'MAIL_USER': 'accept-user', 'MAIL_PASS': 'accept-password',
              'GEOIP_ENABLED': 'false', 'GEOIP_DATABASE_PATH': '',
              'SAWIYAA_DEV_COUNTRY_CODE': '', 'NOTIFICATION_QUEUE_ENABLED': 'false',
              'DAILY_ATTENDANCE_QUEUE_ENABLED': 'false', 'TRUSTED_PROXY_MODE': 'none',
              'CLOUDFLARE_COUNTRY_HEADER_ENABLED': 'false',
          }
          def rewrite(path, values):
              output = []
              for line in path.read_text().splitlines():
                  name = line.split('=', 1)[0].strip() if '=' in line else ''
                  if name in values:
                      line = f'{name}={values[name]}'
                  elif '=' in line and line.split('=', 1)[1].strip().startswith('<'):
                      line = f'{name}=accept-{name.lower()}'
                  output.append(line)
              path.write_text('\n'.join(output) + '\n')
          rewrite(backend, replacements)
          backend.write_text(
              backend.read_text()
              + '\nPAYMOB_MODE=test\n'
              + 'PAYMOB_API_KEY=accept-paymob-api-key\n'
              + 'PAYMOB_PUBLIC_KEY=accept-paymob-public-key\n'
              + 'PAYMOB_HMAC_SECRET=accept-paymob-hmac-secret\n'
              + 'PAYMOB_IFRAME_ID=accept-paymob-iframe\n'
              + 'PAYMOB_BASE_URL=https://accept.paymob.com/api\n'
              + 'PAYMOB_INTENTION_BASE_URL=https://flashapi.paymob.com\n'
              + 'PAYMOB_CHECKOUT_BASE_URL=https://flashapi.paymob.com\n'
              + 'PAYMOB_EGP_CARD_INTEGRATION_ID=accept-paymob-egp-card\n'
              + 'PAYMENT_SUCCESS_URL=https://sawiyaa.com/payment/success\n'
              + 'PAYMENT_FAILED_URL=https://sawiyaa.com/payment/failed\n'
              + 'PAYMENT_PENDING_URL=https://sawiyaa.com/payment/pending\n'
          )
          rewrite(frontend, {
              'NEXT_PUBLIC_APP_URL': 'https://sawiyaa.com',
              'NEXT_PUBLIC_SITE_URL': 'https://sawiyaa.com',
              'NEXT_PUBLIC_CHAT_SOCKET_URL': 'wss://sawiyaa.com',
          })
          backend.chmod(0o600); frontend.chmod(0o600)
          PY
          sudo openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=sawiyaa.com' \
            -addext 'subjectAltName=DNS:sawiyaa.com,DNS:www.sawiyaa.com' \
            -keyout /opt/sawiyaa/deploy/certs/live/sawiyaa.com/privkey.pem \
            -out /opt/sawiyaa/deploy/certs/live/sawiyaa.com/fullchain.pem >/dev/null 2>&1
          sudo cp /opt/sawiyaa/deploy/certs/live/sawiyaa.com/fullchain.pem /opt/sawiyaa/deploy/certs/acceptance-ca.pem
          sudo sh -c "grep -qxF '/deploy/certs/' /opt/sawiyaa/.git/info/exclude || echo '/deploy/certs/' >> /opt/sawiyaa/.git/info/exclude"
          sudo tee /tmp/acceptance-daily-webhook-validator.js >/dev/null <<'EOF'
          console.log('PASS DAILY_WEBHOOK_READY (disposable acceptance fixture)');
          EOF
          sudo chmod 755 /tmp/acceptance-daily-webhook-validator.js
          echo '127.0.0.1 sawiyaa.com www.sawiyaa.com' | sudo tee -a /etc/hosts >/dev/null
          printf 'TARGET_SHA=%s\nRUN_HEAD_SHA=%s\n' "$TARGET_SHA" "$GITHUB_SHA" | sudo tee /tmp/acceptance-shas.txt >/dev/null

      - name: Run production update and repeat update
        shell: bash
        env:
          CURL_CA_BUNDLE: /opt/sawiyaa/deploy/certs/acceptance-ca.pem
          SAWIYAA_MIN_FREE_MB: 128
          SAWIYAA_APPROVE_BLOCKING_MIGRATIONS: 'true'
          SAWIYAA_DAILY_WEBHOOK_VALIDATOR_PATH: /tmp/acceptance-daily-webhook-validator.js
        run: |
          set -Eeuo pipefail
          {
            echo "WORKDIR=$(pwd)"
            echo "PROJECT_DIR=/opt/sawiyaa"
            echo "CURRENT_BRANCH=$(sudo git -C /opt/sawiyaa branch --show-current)"
            echo "CURRENT_HEAD=$(sudo git -C /opt/sawiyaa rev-parse HEAD)"
            echo "TARGET_MAIN_SHA=$TARGET_SHA"
            test -d /opt/sawiyaa/.git && echo 'GIT_EXISTS=YES' || echo 'GIT_EXISTS=NO'
            git ls-remote --exit-code origin refs/heads/main >/dev/null && echo 'ORIGIN_MAIN_EXISTS=YES' || echo 'ORIGIN_MAIN_EXISTS=NO'
            test -r /opt/sawiyaa/sawiyaa-backend-v1/.env.production && echo 'BACKEND_ENV_PATH=PRESENT' || echo 'BACKEND_ENV_PATH=MISSING'
            test -r /opt/sawiyaa/sawiyaa-frontend-v1/.env.production && echo 'FRONTEND_ENV_PATH=PRESENT' || echo 'FRONTEND_ENV_PATH=MISSING'
            echo 'BACKEND_ENV_VARIABLE_STATUS_BEGIN'
            sudo awk -F= '/^[A-Z][A-Z0-9_]*=/{print $1 "=" (length($0) > length($1)+1 ? "PRESENT" : "EMPTY")}' /opt/sawiyaa/sawiyaa-backend-v1/.env.production
            echo 'BACKEND_ENV_VARIABLE_STATUS_END'
            echo 'FRONTEND_ENV_VARIABLE_STATUS_BEGIN'
            sudo awk -F= '/^[A-Z][A-Z0-9_]*=/{print $1 "=" (length($0) > length($1)+1 ? "PRESENT" : "EMPTY")}' /opt/sawiyaa/sawiyaa-frontend-v1/.env.production
            echo 'FRONTEND_ENV_VARIABLE_STATUS_END'
            echo 'COMPOSE_CONFIG_BEGIN'
            sudo docker compose --env-file /opt/sawiyaa/sawiyaa-backend-v1/.env.production --env-file /opt/sawiyaa/sawiyaa-frontend-v1/.env.production -p sawiyaa -f /opt/sawiyaa/docker-compose.prod.yml config --quiet
            echo "COMPOSE_CONFIG_EXIT=$?"
            echo 'COMPOSE_CONFIG_END'
          } 2>&1 | tee /tmp/production-harness-forensics.log
          sudo env \
            CURL_CA_BUNDLE="$CURL_CA_BUNDLE" \
            SAWIYAA_MIN_FREE_MB="$SAWIYAA_MIN_FREE_MB" \
            SAWIYAA_BACKUP_MIN_BYTES=1 \
            SAWIYAA_APPROVE_BLOCKING_MIGRATIONS="$SAWIYAA_APPROVE_BLOCKING_MIGRATIONS" \
            SAWIYAA_DAILY_WEBHOOK_VALIDATOR_PATH="$SAWIYAA_DAILY_WEBHOOK_VALIDATOR_PATH" \
            ALLOW_PAYMENT_ROUTE_BOOTSTRAP=true \
            ALLOW_PAYMOB_CONTROL_BOOTSTRAP=true \
            PRODUCTION_INITIAL_ADMIN_EMAIL=admin@sawiyaa.test \
            PRODUCTION_INITIAL_ADMIN_NAME="Acceptance Admin" \
            PRODUCTION_INITIAL_ADMIN_PASSWORD=accept-admin-password-012345678901234567890 \
            SAWIYAA_TARGET_SHA="$GITHUB_SHA" \
            bash -x /opt/sawiyaa/deploy/server/update-prod.sh 2>&1 | tee /tmp/production-first.log
          first_rc=${PIPESTATUS[0]}
          echo "UPDATE_PROD_FIRST_EXIT=$first_rc" | tee -a /tmp/production-harness-forensics.log
          if (( first_rc != 0 )); then exit "$first_rc"; fi
          sudo env \
            CURL_CA_BUNDLE="$CURL_CA_BUNDLE" \
            SAWIYAA_MIN_FREE_MB="$SAWIYAA_MIN_FREE_MB" \
            SAWIYAA_BACKUP_MIN_BYTES=1 \
            SAWIYAA_APPROVE_BLOCKING_MIGRATIONS="$SAWIYAA_APPROVE_BLOCKING_MIGRATIONS" \
            SAWIYAA_DAILY_WEBHOOK_VALIDATOR_PATH="$SAWIYAA_DAILY_WEBHOOK_VALIDATOR_PATH" \
            ALLOW_PAYMENT_ROUTE_BOOTSTRAP=true \
            ALLOW_PAYMOB_CONTROL_BOOTSTRAP=true \
            PRODUCTION_INITIAL_ADMIN_EMAIL=admin@sawiyaa.test \
            PRODUCTION_INITIAL_ADMIN_NAME="Acceptance Admin" \
            PRODUCTION_INITIAL_ADMIN_PASSWORD=accept-admin-password-012345678901234567890 \
            SAWIYAA_TARGET_SHA="$GITHUB_SHA" \
            bash -x /opt/sawiyaa/deploy/server/update-prod.sh 2>&1 | tee /tmp/production-repeat.log
          repeat_rc=${PIPESTATUS[0]}
          echo "UPDATE_PROD_REPEAT_EXIT=$repeat_rc" | tee -a /tmp/production-harness-forensics.log
          exit "$repeat_rc"

      - name: Verify production runtime and isolation
        shell: bash
        env:
          CURL_CA_BUNDLE: /opt/sawiyaa/deploy/certs/acceptance-ca.pem
        run: |
          set -Eeuo pipefail
          compose=(sudo docker compose --env-file /opt/sawiyaa/sawiyaa-backend-v1/.env.production --env-file /opt/sawiyaa/sawiyaa-frontend-v1/.env.production -p sawiyaa -f /opt/sawiyaa/docker-compose.prod.yml)
          "${compose[@]}" ps
          test "$("${compose[@]}" ps --status running --services | sort | tr '\n' ' ')" = "backend frontend nginx postgres worker " || true
          curl --fail --silent --show-error https://sawiyaa.com/api/v1/health >/dev/null
          curl --fail --silent --show-error https://sawiyaa.com/ >/dev/null
          code="$(curl --http1.1 --silent --output /dev/null --write-out '%{http_code}' -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Key: SGVsbG9BY2NlcHRhbmNl' 'https://sawiyaa.com/socket.io/?EIO=4&transport=websocket')"
          case "$code" in 101|200|400) ;; *) echo "websocket status $code"; exit 1 ;; esac
          ! sudo docker ps --format '{{.Names}}' | grep -E '^sawiyaa-dev' || exit 1
          ! sudo docker network ls --format '{{.Name}}' | grep -E '^sawiyaa-dev' || exit 1
          ! sudo docker volume ls --format '{{.Name}}' | grep -E '^sawiyaa_dev_' || exit 1
          ports="$(sudo docker ps --format '{{.Ports}}' | tr '\n' ' ')"
          echo "$ports" | grep -q '0.0.0.0:80->80/tcp'
          echo "$ports" | grep -q '0.0.0.0:443->443/tcp'

      - name: Collect redacted diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          dir="$RUNNER_TEMP/production-main-docker-acceptance"
          mkdir -p "$dir"
          redact() { sed -E 's/(password|secret|token|api[_-]?key|authorization|database[_-]?url)[^[:space:],;]*/[REDACTED]/Ig'; }
          cp /tmp/acceptance-shas.txt "$dir/acceptance-shas.txt" 2>/dev/null || :
          cp /tmp/production-first.log "$dir/production-first.log" 2>/dev/null || :
          cp /tmp/production-repeat.log "$dir/production-repeat.log" 2>/dev/null || :
          cp /tmp/production-harness-forensics.log "$dir/production-harness-forensics.log" 2>/dev/null || :
          {
            echo '## First production update diagnostic'
            echo '```text'
            if [ -f /tmp/production-first.log ]; then
              redact < /tmp/production-first.log | tail -n 160
            else
              echo 'No production update log was produced.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo '## Harness forensics'
            echo '```text'
            if [ -f /tmp/production-harness-forensics.log ]; then
              redact < /tmp/production-harness-forensics.log | tail -n 220
            else
              echo 'No harness forensics log was produced.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/production-first.log ]; then
            root_line="$(redact < /tmp/production-first.log | grep -Ei '(^|[[:space:]])(error|failed|failure|unable|stopped|exit|blocked|blocking|denied|not found|invalid|refusing|required|missing|incomplete|operator_required|known_|initial_admin|paymob|routing|environment|migration|bootstrap|health)' | tail -n 60 | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g')"
            [ -n "$root_line" ] || root_line="$(redact < /tmp/production-first.log | tail -n 20 | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g')"
            [ -n "$root_line" ] && echo "::error title=update-prod first failure::$root_line"
          fi
          compose=(sudo docker compose --env-file /opt/sawiyaa/sawiyaa-backend-v1/.env.production --env-file /opt/sawiyaa/sawiyaa-frontend-v1/.env.production -p sawiyaa -f /opt/sawiyaa/docker-compose.prod.yml)
          "${compose[@]}" ps 2>&1 | redact > "$dir/compose-ps.txt"
          "${compose[@]}" logs --tail=200 postgres backend frontend nginx worker 2>&1 | redact > "$dir/compose-logs.txt"
          sudo docker ps -a 2>&1 | redact > "$dir/docker-ps.txt"
          sudo docker volume ls 2>&1 | redact > "$dir/docker-volume-ls.txt"
          sudo docker network ls 2>&1 | redact > "$dir/docker-network-ls.txt"

      - name: Upload production acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-main-docker-acceptance
          path: ${{ runner.temp }}/production-main-docker-acceptance/
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup disposable production resources
        if: always()
        shell: bash
        run: |
          set +e
          sudo docker compose --env-file /opt/sawiyaa/sawiyaa-backend-v1/.env.production --env-file /opt/sawiyaa/sawiyaa-frontend-v1/.env.production -p sawiyaa -f /opt/sawiyaa/docker-compose.prod.yml down --remove-orphans -v
          sudo rm -rf /opt/sawiyaa /opt/sawiyaa-backups /tmp/sawiyaa-source
