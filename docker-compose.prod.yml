name: sawiyaa

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    env_file:
      - ./sawiyaa-backend-v1/.env.postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sawiyaa_internal

  backend:
    image: sawiyaa-backend-v1:production
    build:
      context: ./sawiyaa-backend-v1
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./sawiyaa-backend-v1/.env
    environment:
      SAWIYAA_RELEASE_SHA: ${SAWIYAA_RELEASE_SHA:-}
    volumes:
      - backend_storage:/app/storage
      - backend_uploads:/app/uploads
      - ./logs/backend:/app/logs
      - ./geoip/GeoLite2-Country.mmdb:/opt/sawiyaa/geoip/GeoLite2-Country.mmdb:ro
    depends_on:
      backend_volume_init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    expose:
      - "7000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sawiyaa_internal

  # Existing named volumes are not re-owned when mounted into a new
  # container. Preserve their contents while ensuring the non-root backend
  # user can write them before the backend starts.
  backend_volume_init:
    image: sawiyaa-backend-v1:production
    user: "0:0"
    restart: "no"
    command:
      [
        "sh",
        "-c",
        "chown -R 10001:10001 /app/storage /app/uploads && chmod 0750 /app/storage /app/uploads",
      ]
    volumes:
      - backend_storage:/app/storage
      - backend_uploads:/app/uploads
    networks:
      - sawiyaa_internal

  frontend:
    build:
      context: ./sawiyaa-frontend-v1
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        API_PROXY_TARGET: ${API_PROXY_TARGET}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
        NEXT_PUBLIC_SHOW_DETAILED_ERRORS: ${NEXT_PUBLIC_SHOW_DETAILED_ERRORS}
        NEXT_PUBLIC_TOKEN_EXPIRY_DAYS: ${NEXT_PUBLIC_TOKEN_EXPIRY_DAYS}
        NEXT_PUBLIC_REFRESH_TOKEN_EXPIRY_DAYS: ${NEXT_PUBLIC_REFRESH_TOKEN_EXPIRY_DAYS}
        NEXT_PUBLIC_CHAT_SOCKET_URL: ${NEXT_PUBLIC_CHAT_SOCKET_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SHOW_TEST_CREDENTIALS: ${NEXT_PUBLIC_SHOW_TEST_CREDENTIALS}
        NEXT_PUBLIC_PRACTITIONER_LOGIN_OTP_ENABLED: ${NEXT_PUBLIC_PRACTITIONER_LOGIN_OTP_ENABLED}
        NEXT_PUBLIC_ENABLE_ANALYTICS: ${NEXT_PUBLIC_ENABLE_ANALYTICS}
        NEXT_PUBLIC_ENABLE_NOTIFICATIONS: ${NEXT_PUBLIC_ENABLE_NOTIFICATIONS}
        NEXT_PUBLIC_ENABLE_DEVTOOLS: ${NEXT_PUBLIC_ENABLE_DEVTOOLS}
        NEXT_PUBLIC_DEBUG_PRACTITIONER_WIZARD: ${NEXT_PUBLIC_DEBUG_PRACTITIONER_WIZARD}
    restart: unless-stopped
    env_file:
      - ./sawiyaa-frontend-v1/.env
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sawiyaa_internal

  nginx:
    image: nginx:1.27-bookworm
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/sawiyaa.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/letsencrypt:ro
    networks:
      - sawiyaa_internal

volumes:
  postgres_data:
  backend_storage:
  backend_uploads:

networks:
  sawiyaa_internal:
    driver: bridge
