services:
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: sawiyaa-mailpit-dev
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    volumes:
      - sawiyaa_mailpit_dev:/data

volumes:
  sawiyaa_mailpit_dev:
