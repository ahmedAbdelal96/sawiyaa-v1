name: sawiyaa-dev

services:
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    expose:
      - "1025"
      - "8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    volumes:
      - sawiyaa_dev_mailpit_data:/data
    networks:
      - sawiyaa_dev_internal

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sawiyaa_dev}
      POSTGRES_USER: ${POSTGRES_USER:-sawiyaa_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
    expose:
      - "5432"
    volumes:
      - sawiyaa_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sawiyaa_dev_internal

  backend:
    image: sawiyaa-backend-v1:development
    build:
      context: ./sawiyaa-backend-v1
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${SAWIYAA_BACKEND_RUNTIME_ENV_FILE:-./sawiyaa-backend-v1/.env}
    environment:
      SAWIYAA_RELEASE_SHA: ${SAWIYAA_RELEASE_SHA:-development}
    expose:
      - "7000"
    volumes:
      - sawiyaa_dev_backend_storage:/app/storage
      - sawiyaa_dev_backend_uploads:/app/uploads
      - ./logs/backend:/app/logs
      - ./geoip/GeoLite2-Country.mmdb:/opt/sawiyaa/geoip/GeoLite2-Country.mmdb:ro
    depends_on:
      backend_volume_init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sawiyaa_dev_internal

  backend_volume_init:
    image: sawiyaa-backend-v1:development
    user: "0:0"
    restart: "no"
    command:
      ["sh", "-c", "chown -R 10001:10001 /app/storage /app/uploads && chmod 0750 /app/storage /app/uploads"]
    volumes:
      - sawiyaa_dev_backend_storage:/app/storage
      - sawiyaa_dev_backend_uploads:/app/uploads
    networks:
      - sawiyaa_dev_internal

  worker:
    image: sawiyaa-backend-v1:development
    build:
      context: ./sawiyaa-backend-v1
      dockerfile: Dockerfile
    command: ["npm", "run", "start:worker"]
    restart: unless-stopped
    env_file:
      - ${SAWIYAA_BACKEND_RUNTIME_ENV_FILE:-./sawiyaa-backend-v1/.env}
    environment:
      SAWIYAA_RELEASE_SHA: ${SAWIYAA_RELEASE_SHA:-development}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sawiyaa_dev_internal

  frontend:
    build:
      context: ./sawiyaa-frontend-v1
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:7000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Sawiyaa Development}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
        NEXT_PUBLIC_SHOW_DETAILED_ERRORS: ${NEXT_PUBLIC_SHOW_DETAILED_ERRORS:-true}
        NEXT_PUBLIC_TOKEN_EXPIRY_DAYS: ${NEXT_PUBLIC_TOKEN_EXPIRY_DAYS:-7}
        NEXT_PUBLIC_REFRESH_TOKEN_EXPIRY_DAYS: ${NEXT_PUBLIC_REFRESH_TOKEN_EXPIRY_DAYS:-30}
        NEXT_PUBLIC_CHAT_SOCKET_URL: ${NEXT_PUBLIC_CHAT_SOCKET_URL:-http://localhost:7001}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SHOW_TEST_CREDENTIALS: ${NEXT_PUBLIC_SHOW_TEST_CREDENTIALS:-false}
        NEXT_PUBLIC_PRACTITIONER_LOGIN_OTP_ENABLED: ${NEXT_PUBLIC_PRACTITIONER_LOGIN_OTP_ENABLED:-true}
        NEXT_PUBLIC_ENABLE_ANALYTICS: ${NEXT_PUBLIC_ENABLE_ANALYTICS:-false}
        NEXT_PUBLIC_ENABLE_NOTIFICATIONS: ${NEXT_PUBLIC_ENABLE_NOTIFICATIONS:-true}
        NEXT_PUBLIC_ENABLE_DEVTOOLS: ${NEXT_PUBLIC_ENABLE_DEVTOOLS:-false}
        NEXT_PUBLIC_DEBUG_PRACTITIONER_WIZARD: ${NEXT_PUBLIC_DEBUG_PRACTITIONER_WIZARD:-0}
    restart: unless-stopped
    env_file:
      - ${SAWIYAA_FRONTEND_RUNTIME_ENV_FILE:-./sawiyaa-frontend-v1/.env}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sawiyaa_dev_internal

  nginx:
    image: nginx:1.27-bookworm
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${SAWIYAA_DEV_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/sawiyaa-dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sawiyaa_dev_internal

volumes:
  sawiyaa_dev_mailpit_data:
  sawiyaa_dev_postgres_data:
  sawiyaa_dev_backend_storage:
  sawiyaa_dev_backend_uploads:

networks:
  sawiyaa_dev_internal:
    driver: bridge
